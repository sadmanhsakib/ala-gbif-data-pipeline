[project]
name = "aus-wildlife-roadkill-risk-mapper"
version = "0.1.0"
description = "A Machine Learning platform that provides warning signs for wildlife-vehicle collisions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "esda>=2.9.0",
    "folium>=0.16.0",
    "geopandas>=1.1.3",
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "libpysal>=4.14.1",
    "matplotlib>=3.10.9",
    "optuna>=4.8.0",
    "pandas>=3.0.3",
    "rasterio>=1.5.0",
    "requests>=2.34.2",
    "shap>=0.51.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "streamlit>=1.57.0",
    "streamlit-folium>=0.21.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
run = [
    "folium>=0.16.0",
    "geopandas>=1.1.3",
    "joblib>=1.5.3",
    "matplotlib>=3.10.9",
    "pandas>=3.0.3",
    "shap>=0.51.0",
    "streamlit>=1.57.0",
    "streamlit-folium>=0.21.0",
]