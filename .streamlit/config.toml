# Streamlit-level theme — sets the base palette/fonts so the app renders in the
# right colours immediately on cold start, before style.css finishes loading.
[theme]
base = "light"
primaryColor = "#243B2E"          # eucalyptus brand green
backgroundColor = "#F6F4EE"       # warm paper canvas
secondaryBackgroundColor = "#FFFFFF"
textColor = "#221F1A"             # warm charcoal
font = "sans serif"

[server]
fileWatcherType = "none"
enableStaticServing = true
runOnSave = false
maxUploadSize = 1
address = "0.0.0.0"
port = 8501

[runner]
fastReruns = true

[browser]
gatherUsageStats = false
